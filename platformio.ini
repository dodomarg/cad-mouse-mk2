; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
default_envs = seeed_xiao_esp32s3

; Optional, gitignored local overrides (e.g. spoofed USB VID/PID for testing).
; Missing file is fine because of the glob pattern.
extra_configs = platformio_local*.ini

; Settings shared by every board environment.
[env]
framework = arduino
lib_deps = 
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040

board_build.core = earlephilhower
; board_build.arduino.earlephilhower.usb_vid =
; board_build.arduino.earlephilhower.usb_pid =
; board_build.arduino.earlephilhower.usb_manufacturer =
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

build_flags = 
	-DUSE_TINYUSB

; Route USB through the TinyUSB (USB-OTG) stack so the custom 6DoF HID
; descriptor in HIDController can be used, while keeping the CDC serial port
; for telemetry. On ESP32 the custom HID device is built with the native
; arduino-esp32 USBHID API (USB.h / USBHID.h), which reuses the TinyUSB stack
; bundled with the core, so no external TinyUSB library is required (adding one
; would duplicate the TinyUSB device stack at link time).
[esp32s3_flags]
build_flags = 
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
monitor_speed = 115200

; The native USB-Serial-JTAG / CDC port ties DTR/RTS to the reset+boot circuit,
; so opening the monitor normally reboots the board. Leave both lines untouched
; so attaching the monitor does not reset the running firmware.
monitor_dtr = 0
monitor_rts = 0

build_flags = 
	${esp32s3_flags.build_flags}

; The native USB-Serial-JTAG peripheral does not support esptool's classic
; DTR/RTS auto-reset (it throws "OSError: [Errno 71] Protocol error" on Linux).
; Enter download mode manually (hold BOOT, tap RESET, release BOOT) and let
; esptool flash without toggling the reset lines, then press RESET to run.
upload_flags = 
	--before=no_reset
	--after=no_reset

; Diagnostic-only build: an I2C bus scanner that reports how many magnetometers
; ACK on the bus via the LED ring (green LED per device, all red if none).
; Compiles ONLY diag/i2c_scan.cpp instead of the normal firmware sources.
;   Flash:   pio run -e diag_i2c -t upload
;   Restore: pio run -e seeed_xiao_esp32s3 -t upload
[env:diag_i2c]
extends = env:seeed_xiao_esp32s3
build_src_filter = 
	-<*>
	+<../../diag/i2c_scan2.cpp>