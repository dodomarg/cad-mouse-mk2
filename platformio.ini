; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
default_envs = seeed_xiao_esp32s3

; Settings shared by every board environment.
[env]
framework = arduino
lib_deps = 
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040

board_build.core = earlephilhower
; board_build.arduino.earlephilhower.usb_vid =
; board_build.arduino.earlephilhower.usb_pid =
; board_build.arduino.earlephilhower.usb_manufacturer =
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

build_flags = 
	-DUSE_TINYUSB

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
monitor_speed = 115200

; Route USB through the TinyUSB (USB-OTG) stack so the custom 6DoF HID
; descriptor in HIDController can be used, while keeping the CDC serial port
; for telemetry. Adafruit TinyUSB is bundled with the arduino-esp32 core, so it
; does not need to be listed in lib_deps.
build_flags = 
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1